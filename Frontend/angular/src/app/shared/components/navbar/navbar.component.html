<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-logo" routerLink="/">
      <span class="logo-emoji">🍔</span> 
      <span class="logo-text">M-CARS Food</span>
    </div>
    
    <div class="nav-links" *ngIf="authService.currentUser$ | async as user">
      <!-- Client Links -->
      <ng-container *ngIf="user.role === 'user'">
        <a routerLink="/ai-recommendation" routerLinkActive="active-link" 
           class="nav-link">🧠 Gợi ý AI</a>
        <a routerLink="/food-recognition" routerLinkActive="active-link" 
           class="nav-link">📷 Nhận diện Món</a>
      </ng-container>

      <!-- Admin Links -->
      <ng-container *ngIf="user.role === 'admin'">
        <a routerLink="/admin/dashboard" routerLinkActive="active-link" 
           class="nav-link">📊 Dashboard</a>
        <a routerLink="/admin/restaurants" routerLinkActive="active-link" 
           class="nav-link">🏪 Nhà hàng</a>
        <a routerLink="/route-optimization" routerLinkActive="active-link" 
           class="nav-link">🗺️ Tối ưu Lộ trình</a>
      </ng-container>
    </div>

    <div class="auth-section">
        <ng-container *ngIf="authService.currentUser$ | async as user; else loginBtn">
            <span class="user-info">{{ user.email }} ({{ user.role }})</span>
            <button (click)="logout()" class="logout-btn">
                Đăng xuất
            </button>
        </ng-container>
        <ng-template #loginBtn>
            <button routerLink="/login" class="login-btn">
                Đăng nhập
            </button>
        </ng-template>
    </div>
  </div>
</nav>
