<div class="restaurant-card">
  <div class="card-image-container">
    <img [src]="restaurant.imageUrl" [alt]="restaurant.name" class="card-image">
    <div class="card-badge">
      <span class="text-orange-500">⭐</span>
      <span class="rating-text">4.8 (1.2k+)</span>
    </div>
  </div>
  
  <div class="card-content">
    <div class="flex justify-between items-start mb-2">
        <h3 class="card-title">{{ restaurant.name }}</h3>
        <span class="badge badge-primary">Free Delivery</span>
    </div>
    <p class="card-description">{{ restaurant.description }}</p>
    
    <div class="card-footer">
      <div class="flex gap-6">
        <div class="info-item">
          <span class="text-primary-600 text-lg"><i class="ri-time-line"></i></span>
          {{ restaurant.openingHours || '15-20 min' }}
        </div>
        <div class="info-item">
          <span class="text-primary-600 text-lg"><i class="ri-map-pin-line"></i></span>
          1.5 km
        </div>
      </div>
      
      <button class="menu-button">
        Thực đơn
      </button>
    </div>
  </div>
</div>
