<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        🍔
      </div>
      <h2 class="login-title">Chào mừng!</h2>
      <p class="login-subtitle">Đăng nhập để khám phá thế giới ẩm thực AI</p>
    </div>

    <form class="form-group" (ngSubmit)="onSubmit()">
      <div>
        <label for="email" class="form-label">Email Address</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-text-light text-xl">
            <i class="ri-mail-line"></i>
          </span>
          <input id="email" name="email" type="email" required [(ngModel)]="email"
            class="form-input pl-12" placeholder="admin@foodapp.com">
        </div>
      </div>

      <div>
        <label for="password" class="form-label">Password</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-text-light text-xl">
            <i class="ri-lock-line"></i>
          </span>
          <input id="password" name="password" type="password" required [(ngModel)]="password"
            class="form-input pl-12" placeholder="••••••••">
        </div>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <div class="flex items-center justify-between mt-4">
        <div class="flex items-center gap-2">
          <input id="remember-me" name="remember-me" type="checkbox" class="w-5 h-5 rounded-lg border-border text-primary-600 focus:ring-primary-500">
          <label for="remember-me" class="text-xs font-bold text-text-muted cursor-pointer">Ghi nhớ tôi</label>
        </div>
        <a class="text-xs font-bold text-primary-600 hover:text-primary-700 cursor-pointer">Quên mật khẩu?</a>
      </div>

      <button type="submit" [disabled]="isLoading" class="login-button">
        <span *ngIf="!isLoading">Đăng nhập</span>
        <span *ngIf="isLoading" class="flex items-center justify-center gap-3">
          <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Đang xử lý...
        </span>
      </button>

      <div class="social-login">
        <p class="text-xs font-black text-text-light uppercase tracking-widest">Hoặc kết nối với</p>
        <div class="social-icons">
          <button type="button" class="social-btn text-[#1877F2] text-xl"><i class="ri-facebook-fill"></i></button>
          <button type="button" class="social-btn text-[#DB4437] text-xl"><i class="ri-google-fill"></i></button>
          <button type="button" class="social-btn text-[#1DA1F2] text-xl"><i class="ri-twitter-fill"></i></button>
        </div>
      </div>

      <p class="mt-10 text-center text-sm font-medium text-text-muted">
        Chưa có tài khoản? 
        <a routerLink="/register" class="text-primary-600 font-bold hover:underline cursor-pointer">Đăng ký ngay</a>
      </p>
    </form>
  </div>
</div>
