<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        🍕
      </div>
      <h2 class="login-title">Đăng Ký Tài Khoản</h2>
      <p class="login-subtitle">Tham gia hệ thống đề xuất món ăn AI thông minh</p>
    </div>

    <form class="form-group" (ngSubmit)="onSubmit()">
      <div>
        <label for="fullName" class="form-label">Họ và Tên</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-text-light text-xl">
            <i class="ri-user-line"></i>
          </span>
          <input id="fullName" name="fullName" type="text" required [(ngModel)]="fullName"
            class="form-input pl-12" placeholder="Nguyễn Văn A">
        </div>
      </div>

      <div>
        <label for="phoneNumber" class="form-label">Số điện thoại</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-text-light text-xl">
            <i class="ri-phone-line"></i>
          </span>
          <input id="phoneNumber" name="phoneNumber" type="tel" required [(ngModel)]="phoneNumber"
            class="form-input pl-12" placeholder="0912345678">
        </div>
      </div>

      <div>
        <label for="email" class="form-label">Email</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-text-light text-xl">
            <i class="ri-mail-line"></i>
          </span>
          <input id="email" name="email" type="email" required [(ngModel)]="email"
            class="form-input pl-12" placeholder="email@example.com">
        </div>
      </div>

      <div>
        <label for="password" class="form-label">Mật khẩu</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-text-light text-xl">
            <i class="ri-lock-line"></i>
          </span>
          <input id="password" name="password" type="password" required [(ngModel)]="password"
            class="form-input pl-12" placeholder="••••••••">
        </div>
      </div>

      <div>
        <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-text-light text-xl">
            <i class="ri-lock-password-line"></i>
          </span>
          <input id="confirmPassword" name="confirmPassword" type="password" required [(ngModel)]="confirmPassword"
            class="form-input pl-12" placeholder="••••••••">
        </div>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="isLoading" class="login-button">
        <span *ngIf="!isLoading">Tạo Tài Khoản</span>
        <span *ngIf="isLoading" class="flex items-center justify-center gap-3">
          <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Đang xử lý...
        </span>
      </button>

      <p class="mt-8 text-center text-sm font-medium text-text-muted">
        Đã có tài khoản? 
        <a routerLink="/login" class="text-primary-600 font-bold hover:underline cursor-pointer">Đăng nhập</a>
      </p>
    </form>
  </div>
</div>
