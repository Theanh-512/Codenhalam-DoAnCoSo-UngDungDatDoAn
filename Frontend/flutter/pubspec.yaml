name: flutter_food_app
description: "M-CARS-Food Delivery App with AI Integration"
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.3.6
  supabase_flutter: ^1.10.21
  http: ^1.6.0
  geolocator: ^13.0.1
  intl: ^0.19.0
  image_picker: ^1.0.4
  flutter_image_compress: ^2.3.0
  cupertino_icons: ^1.0.8
  otp_pin_field: ^1.4.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/font/Satoshi-Regular.otf
          weight: 400
        - asset: assets/font/Satoshi-Medium.otf
          weight: 500
        - asset: assets/font/Satoshi-Bold.otf
          weight: 700
        - asset: assets/font/Satoshi-Black.otf
          weight: 900
